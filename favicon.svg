<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="chilloutBlue" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35d6ff"/>
      <stop offset="0.52" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#9a6cff"/>
    </linearGradient>
    <radialGradient id="shine" cx="35" cy="28" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="crescentMask">
      <rect width="180" height="180" fill="black"/>
      <circle cx="78" cy="86" r="45" fill="white"/>
      <circle cx="99" cy="72" r="45" fill="black"/>
    </mask>
  </defs>
  <rect width="180" height="180" rx="45" fill="url(#chilloutBlue)"/>
  <rect width="180" height="180" rx="45" fill="url(#shine)"/>
  <circle cx="78" cy="86" r="45" fill="#fff7cf" opacity="0.38" filter="url(#softGlow)" mask="url(#crescentMask)"/>
  <circle cx="78" cy="86" r="45" fill="#fff9d9" mask="url(#crescentMask)"/>
</svg>
